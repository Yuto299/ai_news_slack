name: "#ai-news AIニュース (毎日 8:00 / 20:00)"

on:
  schedule:
    # GitHub の cron は遅れたり、まれに実行自体が飛ばされたりするため、
    # 配信の 15 分前に起動して配信時刻まで待つのに加え、予備の起動時刻を 2 つずつ置く（投稿済みなら何もしない）。
    - cron: "45 22 * * *" # 07:45 JST 朝版
    - cron: "10 23 * * *" # 08:10 JST 朝版（予備）
    - cron: "40 23 * * *" # 08:40 JST 朝版（予備）
    - cron: "45 10 * * *" # 19:45 JST 夜版
    - cron: "10 11 * * *" # 20:10 JST 夜版（予備）
    - cron: "40 11 * * *" # 20:40 JST 夜版（予備）
  workflow_dispatch:
    inputs:
      slot:
        description: "配信する版（空欄なら現在時刻から自動判定）"
        type: choice
        options: ["", morning, evening]
        default: ""
      dry_run:
        description: "Slack に投稿せず、結果をログに表示するだけ"
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/_run-channel.yml
    secrets: inherit
    with:
      channel: ai-news
      webhook_secret: SLACK_WEBHOOK_URL
      # 初期からの履歴を引き継ぐため、このチャンネルだけ旧来のファイル名・キャッシュ名を使う
      history_file: posted_history.json
      cache_prefix: posted-history
      slot: ${{ inputs.slot || '' }}
      dry_run: ${{ inputs.dry_run || false }}
