name: Daily AI News to Slack

on:
  schedule:
    # 毎日 08:15 JST (= 23:15 UTC) に起動。GitHub の cron は数分〜十数分遅れることがあるため
    # 少し早めに起動し、要約を作ってから POST_AT_JST (08:30) まで待って投稿する。
    - cron: "15 23 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post AI news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 手動実行時は待たずにすぐ投稿
          POST_AT_JST: ${{ github.event_name == 'schedule' && '08:30' || '' }}
        run: python ai_news.py
