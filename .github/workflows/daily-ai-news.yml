name: Daily AI News to Slack

on:
  schedule:
    # 朝 8:00 JST / 夜 20:00 JST に配信。GitHub の cron は数分〜十数分遅れることがあるため
    # 15 分早く起動し、要約を作ってから配信時刻まで待って投稿する（WAIT_FOR_SLOT）。
    - cron: "45 22 * * *" # 07:45 JST → 朝版
    - cron: "45 10 * * *" # 19:45 JST → 夜版
  workflow_dispatch:
    inputs:
      edition:
        description: "配信する版（空欄なら現在時刻から自動判定）"
        type: choice
        options: ["", morning, evening]
        default: ""
      dry_run:
        description: "Slack に投稿せず、結果をログに表示するだけ"
        type: boolean
        default: false

# 投稿履歴の保存が前後の実行と競合しないよう、同時実行は 1 つに制限
concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      # 朝と夜で同じ記事を流さないよう、投稿履歴を実行間で引き継ぐ
      - name: Restore posted history
        uses: actions/cache/restore@v4
        with:
          path: posted_history.json
          key: posted-history-${{ github.run_id }}
          restore-keys: posted-history-

      - name: Post AI news
        env:
          # Claude のサブスク（Pro / Max）枠で実行。`claude setup-token` で発行したトークン
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EDITION: ${{ github.event.schedule == '45 22 * * *' && 'morning' || github.event.schedule == '45 10 * * *' && 'evening' || inputs.edition }}
          # 手動実行時は待たずにすぐ投稿
          WAIT_FOR_SLOT: ${{ github.event_name == 'schedule' && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python ai_news.py ${DRY_RUN:+--dry-run}

      - name: Save posted history
        if: success() && !inputs.dry_run && hashFiles('posted_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: posted_history.json
          key: posted-history-${{ github.run_id }}
