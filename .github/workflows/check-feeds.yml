name: Check candidate feeds (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/check-feeds.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - shell: python
        run: |
          import calendar, time, feedparser, requests
          feeds = {
            # 国内
            "ITmedia ビジネスオンライン": "https://rss.itmedia.co.jp/rss/2.0/bizmakoto.xml",
            "ITmedia エンタープライズ": "https://rss.itmedia.co.jp/rss/2.0/enterprise.xml",
            "Business Insider Japan": "https://www.businessinsider.jp/feed/index.xml",
            "Forbes JAPAN": "https://forbesjapan.com/feed",
            "日経クロストレンド": "https://xtrend.nikkei.com/rss/",
            "日経xTECH": "https://xtech.nikkei.com/rss/index.rdf",
            "東洋経済": "https://toyokeizai.net/list/feed/rss",
            "ZDNET Japan": "https://japan.zdnet.com/rss/index.rdf",
            "CNET Japan": "https://japan.cnet.com/rss/index.rdf",
            "INTERNET Watch": "https://internet.watch.impress.co.jp/data/rss/1.0/iw/feed.rdf",
            "AINOW": "https://ainow.ai/feed/",
            "Ledge.ai": "https://ledge.ai/feed/",
            "STARTUP DB": "https://media.startup-db.com/feed",
            "Coral Capital": "https://coralcap.co/feed/",
            "WIRED.jp": "https://wired.jp/feed/rss",
            "Publickey": "https://www.publickey1.jp/atom.xml",
            "PR TIMES": "https://prtimes.jp/index.rdf",
            # 海外
            "The Decoder": "https://the-decoder.com/feed/",
            "Ars Technica AI": "https://arstechnica.com/ai/feed/",
            "WIRED AI": "https://www.wired.com/feed/tag/ai/latest/rss",
            "Google DeepMind": "https://deepmind.google/blog/rss.xml",
            "NVIDIA Blog": "https://blogs.nvidia.com/feed/",
            "Latent Space": "https://www.latent.space/feed",
            "Simon Willison": "https://simonwillison.net/atom/everything/",
            "Crunchbase AI": "https://news.crunchbase.com/sections/ai/feed/",
          }
          now = time.time()
          for name, url in feeds.items():
              try:
                  r = requests.get(url, headers={"User-Agent": "Mozilla/5.0 (compatible; ai-news-slack/1.0)"}, timeout=20)
                  f = feedparser.parse(r.content)
                  recent = [e for e in f.entries if (e.get("published_parsed") or e.get("updated_parsed")) and now - calendar.timegm(e.get("published_parsed") or e.get("updated_parsed")) < 86400]
                  sample = " | ".join(e.get("title","")[:40] for e in recent[:3])
                  print(f"RESULT {name}: HTTP {r.status_code}, entries={len(f.entries)}, 24h={len(recent)} :: {sample}")
              except Exception as ex:
                  print(f"RESULT {name}: ERROR {ex}")
