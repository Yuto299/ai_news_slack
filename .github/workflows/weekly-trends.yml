name: "#weekly-trends 週次まとめ (日曜 10:00)"

on:
  schedule:
    # 配信の 15 分前に起動し、予備の起動時刻を 2 つ置く（投稿済みなら何もしない）
    - cron: "45 0 * * 0" # 日曜 09:45 JST
    - cron: "10 1 * * 0" # 日曜 10:10 JST（予備）
    - cron: "40 1 * * 0" # 日曜 10:40 JST（予備）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack に投稿せず、結果をログに表示するだけ"
        type: boolean
        default: false
      scheduled:
        description: "定期実行として扱う（cron-job.org から起動するとき用。手動実行ではチェック不要）"
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write  # 投稿内容を archive/ にコミットするため
    uses: ./.github/workflows/_run-channel.yml
    secrets: inherit
    with:
      channel: weekly-trends
      webhook_secret: SLACK_WEBHOOK_WEEKLY_TRENDS
      dry_run: ${{ inputs.dry_run || false }}
      scheduled: ${{ inputs.scheduled || false }}
