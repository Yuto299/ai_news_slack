# 各チャンネルのワークフローから呼ばれる共通処理
name: Run channel

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      webhook_secret:
        description: "投稿先 Webhook URL を入れた Secret の名前"
        type: string
        required: true
      history_file:
        type: string
        default: ""
      cache_prefix:
        type: string
        default: ""
      slot:
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false
      scheduled:
        description: "外部の cron サービスから起動したときに true（定期実行として扱う）"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # 投稿内容を archive/ にコミットするため
    # 履歴の保存が前後の実行と競合しないよう、チャンネルごとに同時実行は 1 つ
    concurrency:
      group: bot-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      HISTORY_FILE: ${{ inputs.history_file || format('history/{0}.json', inputs.channel) }}
      CACHE_PREFIX: ${{ inputs.cache_prefix || format('history-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      # 同じ記事を繰り返し流さないよう、投稿履歴を実行間で引き継ぐ
      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HISTORY_FILE }}
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-

      # 週次まとめは #ai-news が 1 週間に配信した記事を素材に使う（読むだけ）
      - name: Restore ai-news history
        if: inputs.channel == 'weekly-trends'
        uses: actions/cache/restore@v4
        with:
          path: posted_history.json
          key: posted-history-readonly-${{ github.run_id }}
          restore-keys: posted-history-

      - name: Run
        env:
          # Claude のサブスク（Pro / Max）枠で実行。`claude setup-token` で発行したトークン
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets[inputs.webhook_secret] }}
          SLOT: ${{ inputs.slot }}
          # 定期実行（GitHub の cron か、外部の cron サービスからの起動）のときだけ:
          # 投稿済みならスキップ、早く起動したら配信時刻まで待つ
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '1' || '' }}
          # どの cron で起動したか。GitHub の定期実行は数時間遅れることがあるので、実際の起動時刻ではなくこれで枠を決める
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python -m bot "${{ inputs.channel }}" ${DRY_RUN:+--dry-run}

      - name: Save history
        if: success() && !inputs.dry_run && hashFiles(env.HISTORY_FILE) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HISTORY_FILE }}
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}

      # Slack の無料プランは古い投稿が見られなくなるので、投稿した内容を Markdown でリポジトリに残す
      - name: Commit archive
        if: success() && !inputs.dry_run && hashFiles('archive/**') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet && exit 0
          git commit -m "archive: ${{ inputs.channel }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # 他のチャンネルと同時にコミットすることがあるので、取り込み直して再試行する
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
