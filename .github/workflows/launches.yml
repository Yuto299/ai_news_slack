name: "#launches 新プロダクト (毎日 18:00)"

on:
  schedule:
    # 配信の 15 分前に起動し、予備の起動時刻を 2 つ置く（投稿済みなら何もしない）
    - cron: "45 8 * * *" # 17:45 JST
    - cron: "10 9 * * *" # 18:10 JST（予備）
    - cron: "40 9 * * *" # 18:40 JST（予備）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack に投稿せず、結果をログに表示するだけ"
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/_run-channel.yml
    secrets: inherit
    with:
      channel: launches
      webhook_secret: SLACK_WEBHOOK_LAUNCHES
      dry_run: ${{ inputs.dry_run || false }}
