name: Backfill archive from history (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/archive-backfill.yml"]
jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: posted_history.json
          key: posted-history-backfill-${{ github.run_id }}
          restore-keys: posted-history-
      - uses: actions/cache/restore@v4
        with:
          path: history/pain-points.json
          key: history-pain-points-backfill-${{ github.run_id }}
          restore-keys: history-pain-points-
      - uses: actions/cache/restore@v4
        with:
          path: history/launches.json
          key: history-launches-backfill-${{ github.run_id }}
          restore-keys: history-launches-
      - uses: actions/cache/restore@v4
        with:
          path: history/small-biz.json
          key: history-small-biz-backfill-${{ github.run_id }}
          restore-keys: history-small-biz-
      - uses: actions/cache/restore@v4
        with:
          path: history/weekly-trends.json
          key: history-weekly-trends-backfill-${{ github.run_id }}
          restore-keys: history-weekly-trends-
      - uses: actions/cache/restore@v4
        with:
          path: history/subsidies.json
          key: history-subsidies-backfill-${{ github.run_id }}
          restore-keys: history-subsidies-
      - run: python -m bot.backfill ai-news=posted_history.json pain-points=history/pain-points.json launches=history/launches.json small-biz=history/small-biz.json weekly-trends=history/weekly-trends.json subsidies=history/subsidies.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --stat
          git commit -m "archive: restore posts made before archiving started (titles and links from history)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
